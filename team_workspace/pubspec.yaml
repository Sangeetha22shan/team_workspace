name: team_workspace
description: "Team Workspace App for Task management"
version: 1.0.0+1

environment:
  sdk: ^3.10.4


dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4

  # Network
  dio: ^5.10.0

  # Dependency Injection
  get_it: ^9.2.1

  # Local Storage
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2
  path: ^1.9.0

  # Utilities
  intl: ^0.20.3
  logger: ^2.7.0
  connectivity_plus: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

  dartz: ^0.10.1


flutter:


  uses-material-design: true

